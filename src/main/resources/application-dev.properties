
spring.application.name=MS-Auth
server.port=8082

#Cambiar db_microservicio por nombre de BD deseada
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3321/bd_plantilla}
spring.datasource.username=${DB_USER:user_dev}
spring.datasource.password=${DB_PASSWORD:dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

#Seguridad JWT
jwt.secret=mi-llave-super-secreta-para-desarrollo-municipalidad-2024
jwt.issuer=ms-auth
jwt.expiration=3600000
